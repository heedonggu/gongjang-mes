name: 버그 제보
description: 쓰다가 잘못 동작한 것을 알려 주세요
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 실제 거래처 이름·금액 같은 영업 데이터는 올리지 마세요. 취약점은 공개 이슈 대신 SECURITY.md의 방법으로 알려 주세요.
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요
      description: 어느 화면에서 무엇을 눌렀고, 무엇이 나왔나요? 기대한 결과는 무엇인가요?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 다시 해 보는 순서
      placeholder: "1. 견적 탭에서 ...  2. ..."
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경 (OS, Python 버전, 브라우저, PC/폰)
  - type: textarea
    id: log
    attributes:
      label: 서버 창에 나온 오류 문구 (있다면)
      render: text
